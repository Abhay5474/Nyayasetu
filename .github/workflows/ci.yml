name: CI

on:
  push:
  pull_request:

jobs:
  ai-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: nyayasetu, POSTGRES_PASSWORD: nyayasetu, POSTGRES_DB: nyayasetu }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nyayasetu" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-mar tesseract-ocr-hin fonts-noto-core
      - run: pip install -r ai-service/requirements-dev.txt
      - run: pytest -q
        working-directory: ai-service
        env:
          TEST_DATABASE_URL: postgresql://nyayasetu:nyayasetu@localhost:5432/nyayasetu

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: nyayasetu, POSTGRES_PASSWORD: nyayasetu, POSTGRES_DB: nyayasetu_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nyayasetu" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B verify
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/nyayasetu_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm test && npm run build
        working-directory: frontend
